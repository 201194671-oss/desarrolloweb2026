<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Funciones Matemáticas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f4;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            width: 350px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        input {
            padding: 8px;
            margin: 10px 0;
            width: 80%;
        }
        button {
            padding: 10px;
            margin: 5px;
            width: 150px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #4c79f0;
            color: white;
        }
        button:hover {
            opacity: 0.8;
        }
        #resultado {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Funciones Matemáticas</h2>

        <input type="number" id="precio" placeholder="Precio en pesos">
        <button onclick="mostrarIVA()">Calcular IVA</button>
        <br>

        <input type="number" id="peso" placeholder="Cantidad en pesos">
        <button onclick="mostrarConversion()">Convertir a dólares</button>
        <br>

        <input type="number" id="numA" placeholder="Número A">
        <input type="number" id="numB" placeholder="Número B">
        <button onclick="mostrarMultiplicacion()">Multiplicar</button>
        <br>

        <input type="number" id="numero" placeholder="Número">
        <button onclick="mostrarCuadrado()">Cuadrado</button>

        <p id="resultado"></p>
    </div>

    <script>
        const calcularIVA = (precio, tasa = 0.16) => precio * tasa;
        const convertirpesoadolar = (peso, dolar = 17) => peso / dolar;
        const multiplicar = (a, b) => a * b;
        const elcuadradodeunnumero = (numero) => numero * numero;

        const resultado = document.getElementById("resultado");

        function mostrarIVA() {
            const precio = parseFloat(document.getElementById("precio").value);
            resultado.textContent = "IVA: $" + calcularIVA(precio).toFixed(2);
        }

        function mostrarConversion() {
            const peso = parseFloat(document.getElementById("peso").value);
            resultado.textContent = "Equivalente en dólares: $" + convertirpesoadolar(peso).toFixed(2);
        }

        function mostrarMultiplicacion() {
            const a = parseFloat(document.getElementById("numA").value);
            const b = parseFloat(document.getElementById("numB").value);
            resultado.textContent = "Resultado: " + multiplicar(a, b);
        }

        function mostrarCuadrado() {
            const numero = parseFloat(document.getElementById("numero").value);
            resultado.textContent = "Cuadrado: " + elcuadradodeunnumero(numero);
        }
    </script>
</body>
</html>

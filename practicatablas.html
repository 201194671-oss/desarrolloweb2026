<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tabla de Colores</title>
  <style>
    table {
      border-collapse: collapse;
      width: 300px;
      text-align: center;
    }
    td {
      padding: 20px;
      color: white;
      font-weight: bold;
    }
    .rojo {
      background-color: red;
    }
    .verde {
      background-color: green;
    }
    .azul {
      background-color: blue;
    }
  </style>
</head>
<body>
  <h2>Práctica con Tabla</h2>
  <table border="1">
    <tr>
      <td class="rojo">Rojo</td>
      <td class="verde">Verde</td>
      <td class="azul">Azul</td>
    </tr>
  </table>
</body>
</html>

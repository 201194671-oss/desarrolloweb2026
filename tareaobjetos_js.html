<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cuenta Bancaria</title>
</head>
<body>
    <h2>Ejemplo de cuenta bancaria en JavaScript</h2>
    <p>Abre la consola del navegador (F12 → Console) para ver los resultados.</p>

    <script>
        // Definición del objeto cuentaBancaria
        const cuentaBancaria = {
          titular: "José",
          saldo: 1000, // saldo inicial

          depositar(cantidad) {
            if (cantidad > 0) {
              this.saldo += cantidad;
              console.log(`Has depositado $${cantidad}. Nuevo saldo: $${this.saldo}`);
            } else {
              console.log("La cantidad a depositar debe ser mayor que 0.");
            }
          },

          retirar(cantidad) {
            if (cantidad > 0) {
              if (cantidad <= this.saldo) {
                this.saldo -= cantidad;
                console.log(`Has retirado $${cantidad}. Nuevo saldo: $${this.saldo}`);
              } else {
                console.log("Fondos insuficientes para realizar el retiro.");
              }
            } else {
              console.log("La cantidad a retirar debe ser mayor que 0.");
            }
          },

          consultarSaldo() {
            console.log(`Saldo actual: $${this.saldo}`);
            return this.saldo;
          }
        };

        // Ejemplo de uso:
        cuentaBancaria.consultarSaldo();   // Muestra el saldo actual
        cuentaBancaria.depositar(500);     // Deposita dinero
        cuentaBancaria.retirar(300);       // Retira dinero
        cuentaBancaria.retirar(2000);      // Intento de retiro mayor al saldo
    </script>
</body>
</html>
